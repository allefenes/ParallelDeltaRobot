# Delta Robotics V2 robot tanımı: tek doğruluk kaynağı.
# CAD (cad/), kinematik testleri (F1) ve datasheet (F2) bu dosyayı okur; değerler koda kopyalanmaz.
#
# Birimler: uzunluk mm, açı derece, yoğunluk g/cm3, kütle g.
# Her değerin kaynağı `kaynak` alanlarında ya da yorumda belirtilir (bkz. docs/robot-girdileri.md):
#   json        V1 KilavuzDeltaRobotics/data/myRobot.json
#   kullanici   proje sahibinin anlatımı / çizimi
#   turetilmis  kullanıcı bilgisinden hesaplandı
#   varsayim    veri yok, makul değer; ölçümle doğrulanacak
#   katalog     standart parça kataloğu
#
# Koordinat sistemi (V2 robot çerçevesi, V1'den farklı):
#   Orijin: üç motor ekseninin oluşturduğu düzlemin merkezi (taban merkezi).
#   +Z yukarı (V1'de +Z aşağıydı). 1. kol +X yönünde; kollar üstten bakınca saat yönünün tersine 0/120/240°.
#   Motor açısı θ: 0 = kısa kol yatay ve dışa dönük; pozitif θ kolu AŞAĞI indirir (V1 ile aynı işaret).

kinematics:
  base_radius: 65.0 # json base: merkezden motor eksenine
  bicep_length: 64.0 # json bicep: motor ekseni -> üst küresel eklem merkezi
  forearm_length: 201.0 # json forearm: üst -> alt küresel eklem merkezi
  platform_radius: 35.0 # json end: platform merkezi -> alt eklem merkezi
  base_to_floor: 240.0 # json btf: motor ekseni düzlemi -> zemin (POM üst yüzü)
  ee_offset: 15.0 # json eeOffset, kullanici: P'den (platform eklem düzlemi merkezi) mıknatıs ucuna; CAD'de sabit kısıt
  arm_angles: [0.0, 120.0, 240.0] # V1 kodu
  motor_limit_max: 150.0 # json bicepPosAngle (aşağı)
  motor_limit_min: -70.0 # json bicepNegAngle (yukarı)
  spherical_joint_limit: 14.0 # json joint: rot başı yanal açı limiti
  motor_step: 0.29 # json turnAngle: AX-12A 300°/1024

materials: # yoğunluk g/cm3
  al7075: { density: 2.81, kaynak: katalog }
  pom: { density: 1.41, kaynak: katalog }
  steel: { density: 7.85, kaynak: katalog }
  pla_solid: { density: 1.24, kaynak: katalog } # %100 doluluk
  # %20 doluluklu ince PLA parçada duvar ve üst/alt katmanlar baskın; etkin yoğunluk ~%45 alındı
  pla_infill20: { density: 0.56, kaynak: varsayim }

motor: # Dynamixel AX-12A, sadeleştirilmiş zarf
  model: AX-12A
  body: { width: 32.0, height: 50.0, depth: 40.0, kaynak: katalog } # genişlik = çıkış ekseni yönü
  mass: 54.6 # katalog
  # Çıkış ekseninin gövdenin uzun kenarı boyunca uca uzaklığı ve göbek ölçüleri: yaklaşık
  horn_axis_from_end: 11.0 # varsayim
  horn: { diameter: 20.0, thickness: 3.0, kaynak: varsayim }
  stall_torque_nm: 1.5 # katalog, 12 V
  no_load_rpm: 59.0 # katalog, 12 V

output_shaft: # PLA %100; tüm boyu artı kesitli (kullanici), 2 rulmanla yataklı
  journal_diameter: 8.0 # turetilmis: 608ZZ iç çapı; artı kesitin uçları bu dairenin üzerinde
  cross_size: 8.0 # turetilmis: artı kesitin uçtan uca ölçüsü = journal_diameter
  cross_arm_width: 3.0 # varsayim
  bearing_offset: 9.0 # varsayim: rulman merkezlerinin kol düzleminden uzaklığı (±)
  length_beyond_bearing: 4.0 # varsayim

bearing: { model: 608ZZ, inner: 8.0, outer: 22.0, width: 7.0, mass: 12.0, kaynak: kullanici }

bicep: # 7075 levha, lazer kesim
  thickness: 2.0 # kullanici
  motor_lobe_radius: 14.0 # varsayim (cizimden)
  tip_boss_diameter: 10.0 # kullanici
  pin_hole: 5.0 # kullanici
  cross_hole_clearance: 0.2 # varsayim: artı deliğin mile göre boşluğu
  small_holes: { count: 4, diameter: 2.2, pcd: 18.0, kaynak: varsayim } # cizimdeki küçük delikler

rod_end: # dişi M5 rot başı (DIN ISO 12240-4 K serisi, SI5 benzeri)
  bore: 5.0
  ball_diameter: 11.11 # katalog
  ball_width: 8.0 # katalog
  housing_width: 6.0 # katalog
  head_diameter: 18.0 # katalog (yaklaşık)
  center_to_end: 27.0 # katalog (yaklaşık)
  shank_diameter: 9.0 # katalog (yaklaşık)
  thread_depth: 10.0 # varsayim: saplamanın rot başına giren boyu
  tilt_limit: 13.0 # katalog; kinematik limit 14° ile uyumlu
  mass: 12.0 # katalog (yaklaşık); katı model içi dolu olduğundan kütle bu değere sabitlenir

# Pim boyunca sıra (kullanici): somun | dış burç | rot başı | iç burç | kol | iç burç | rot başı | dış burç | somun
joint_stack:
  rod_spacing: 30.0 # kullanici: paralel kol arası değişmez = kol + 2 x iç burç + küre genişliği
  inner_bushing_length: 10.0 # turetilmis: (30 - 2 - 8) / 2; kısa kol tarafı
  outer_bushing_length: 5.0 # kullanici
  bushing_outer: 9.0 # varsayim: burcun geniş ucu
  bushing_cone_outer: 6.5 # varsayim: rot başına bakan dar uç; burç boydan boya konik (kullanici)
  nut: { width_af: 8.0, height: 5.0, kaynak: katalog } # M5 fiber somun
  bushing_material: pla_solid # varsayim: burç malzemesi bilinmiyor

forearm_rod: { diameter: 5.0, kaynak: kullanici } # M5 saplama; boy = forearm - 2*(center_to_end - thread_depth)

platform: # PLA %20
  radius: 35.0 # kullanici (R35)
  thickness: 5.0 # kullanici
  # Eklem düzlemi (P) platform plakasının orta düzlemindedir; böylece P -> mıknatıs ucu = ee_offset sağlanır.
  ear_thickness: 12.0 # varsayim: 30 mm aralık = kulak + 2 x iç burç + 8 mm küre
  inner_bushing_length: 5.0 # turetilmis: (30 - 12 - 8) / 2; dış burç joint_stack'teki gibi
  ear_length: 16.0 # varsayim: kulak gövdesinin radyal boyu (eklem ekseni kenarda, r = radius)
  ear_lug_radius: 6.0 # varsayim: pim çevresindeki kulak göbeği yarıçapı
  # Kullanici: dairesel plaka; kulaklar kenardan biraz taşar. Disk, rot başı gövdelerine değmeyecek kadar küçük.
  disc_radius: 28.0 # varsayim: rot başı gövdesinin en yakın noktası r = 30 mm
  # Süs delikleri (kullanici: 3 adet, işlevsiz). Kulakların arasında; mıknatıs cebine ve kesiklere değmez.
  deco_holes: { count: 3, diameter: 8.0, radius: 17.0, angle_offset: 60.0, kaynak: varsayim }

# Mıknatıs platformdaki cebe oturur; cep derinliği ee_offset'ten türetilir (üst yüzü P düzleminde).
electromagnet: { diameter: 20.0, height: 15.0, mass: 35.0, kaynak: varsayim } # yükseklik kullanici

frame:
  plate_thickness: 5.0 # kullanici
  ceiling_round_radius: 45.0 # varsayim: kullanıcıya göre robot tarafı yarıçapı küçük; bağlantı delikleri merkeze yakın
  neck_width: 70.0 # varsayim
  column_azimuth: 180.0 # varsayim: sütun -X yönünde, 2. ve 3. kolun arasında
  column_distance: 210.0 # varsayim: robot merkezinden sütun merkezine
  column_radius: 50.0 # varsayim: yarım silindir dış yarıçapı; açık yüzü 5 mm levhayla kapalı (D kesit, kullanici)
  pom_round_radius: 160.0 # varsayim
  pom_width: 320.0 # varsayim
  pom_extra_behind_column: 60.0 # varsayim

housing: # PLA motor gövdesi, tavanın altına asılı
  # Kullanici: plaka rulman yataklarını tam taşıyacak en küçük yarıçapta. 'auto' = yatak dış köşesi + pay.
  top_radius: auto
  top_margin: 2.5 # varsayim: yatak dış köşesinden plaka kenarına pay
  motor_box_wall: 2.5 # varsayim: motorun oturduğu kutunun et kalınlığı (altı açık, motor alttan girer)
  horn_hole_diameter: 24.0 # varsayim: kutu duvarında göbeğin döndüğü delik
  top_thickness: 5.0 # varsayim
  clearance_above_motor: 2.0 # varsayim
  bearing_block_width: 32.0 # varsayim: radyal; kapak vidaları rulmana ve askıya değmesin
  bearing_block_below_axis: 16.0 # varsayim
  cap_height: 13.0 # varsayim
  cap_screw:
    {
      diameter: 3.0,
      head_diameter: 5.5,
      head_height: 3.0,
      depth_into_block: 8.0,
      offset: 13.0,
      kaynak: varsayim,
    }
  mount_holes: { count: 3, diameter: 5.5, pcd: 36.0, kaynak: varsayim } # motor halkasının içinde, kollar arasında (60/180/300°)
  # Kısa kol açıklıkları (kullanici: dikdörtgen). Kol çerçevesinde: x radyal (motor ekseninden), y teğet.
  # Kullanici: yalnız 3 mm; kısa kol levhası (2 mm) geçer, rulman yatakları plakaya bağlı kalır.
  arm_slot: { width: 3.0, x_from: -8.0, x_to: 40.0, kaynak: kullanici }

# Radyuslar (kullanici: çentik etkisi ve görünüm için mümkün olan her yerde). Satın alınan parçalara uygulanmaz.
fillets:
  ceiling: 8.0 # varsayim: boyun geçişleri
  pom_corner: 20.0 # varsayim: dikdörtgen uç köşeleri
  housing_slot: 3.0 # varsayim: üst plaka açıklık köşeleri
  motor_box: 2.0 # varsayim: kutu dış kenarları
  platform: 1.5 # varsayim: kulak kökleri ve kesik köşeleri
  bicep_hole: 0.8 # varsayim: artı deliğin iç köşeleri (milin radyusundan büyük)
  shaft_inner: 0.5 # varsayim: artı kesitin iç köşeleri

assembly_pose: # montaj ve render pozu: platform eklem düzlemi merkezi (V2 çerçevesi)
  x: 0.0
  y: 0.0
  z: -190.0

# Ek kontrol pozları: yalnız çakışma kontrolü ve görsel için. kol1_yukari: 1. kol ~-70° (yazılım limiti).
check_poses:
  - { name: kol1_yukari, x: 52.0, y: 0.0, z: -141.0 }
