[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "delta-api"
version = "0.1.0"
description = "Delta Robotics V2 komut API'si (FastAPI ağ geçidi)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "websockets>=12",
  "pyyaml>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["delta_api"]

[tool.ruff]
extend = "../pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# ROS arka ucu yalnız ROS imajında, uçtan uca testte sınanır.
omit = ["delta_api/ros_backend.py", "delta_api/main.py"]
