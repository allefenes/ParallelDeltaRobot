<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Delta Robotics</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1 data-i18n="app.title">Delta Robotics</h1>
        <span class="subtitle" data-i18n="web.exp.subtitle"></span>
      </div>
      <div class="status-line">
        <span
          id="state-badge"
          class="badge state"
          data-state="DISCONNECTED"
          role="status"
          aria-live="polite"
        ></span>
        <span id="magnet-badge" class="badge" data-on="false"></span>
      </div>
      <button
        type="button"
        id="stop-top"
        class="stop stop-top"
        data-action="stop"
        data-i18n="web.jog.stop"
        data-i18n-aria-label="web.exp.stop_aria"
      ></button>
    </header>

    <div id="notice" class="notice" role="alert" hidden></div>

    <main class="layout">
      <section class="twin-panel" aria-labelledby="twin-h">
        <h2 id="twin-h" class="sr-only" data-i18n="nav.twin"></h2>
        <div id="twin" class="twin" data-testid="twin">
          <p id="twin-msg" class="twin-msg muted" data-i18n="web.twin.waiting"></p>
          <div class="twin-overlay mono" aria-live="off">
            <div>
              <span data-i18n="web.telemetry.angles"></span>: <span id="tele-angles">—</span>
            </div>
            <div>
              <span data-i18n="web.telemetry.position"></span>: <span id="tele-pos">—</span>
            </div>
          </div>
        </div>
        <p class="muted small" data-i18n="web.exp.twin_legend"></p>
        <p class="muted small live-note" data-i18n="web.exp.live_soon"></p>
      </section>

      <section class="panel control-panel">
        <div class="tabs" role="tablist" data-i18n-aria-label="web.exp.modes">
          <button
            type="button"
            role="tab"
            id="tab-auto"
            aria-controls="panel-auto"
            aria-selected="true"
            data-i18n="web.exp.tab_auto"
          ></button>
          <button
            type="button"
            role="tab"
            id="tab-manual"
            aria-controls="panel-manual"
            aria-selected="false"
            tabindex="-1"
            data-i18n="web.exp.tab_manual"
          ></button>
        </div>

        <!-- Otomatik mod: robot kendi kendine tic-tac-toe oynar -->
        <div id="panel-auto" role="tabpanel" aria-labelledby="tab-auto" class="tabpanel">
          <p class="muted small" data-i18n="web.auto.intro"></p>
          <div class="row">
            <button
              type="button"
              id="auto-start"
              class="primary"
              data-i18n="web.auto.start"
            ></button>
            <button type="button" id="auto-stop" data-i18n="web.auto.stop"></button>
            <button type="button" id="auto-reset" data-i18n="web.auto.reset"></button>
          </div>
          <dl class="kv game-kv">
            <dt data-i18n="web.auto.status_label"></dt>
            <dd id="auto-status" data-status="idle" aria-live="polite">—</dd>
            <dt data-i18n="web.auto.turn_label"></dt>
            <dd id="auto-turn">—</dd>
            <dt data-i18n="web.auto.winner_label"></dt>
            <dd id="auto-winner">—</dd>
          </dl>
          <div id="auto-result" class="result" role="status"></div>
          <div class="game">
            <figure class="board-fig">
              <div id="board-diagram" class="board" role="img"></div>
              <figcaption class="muted small" data-i18n="web.auto.board_caption"></figcaption>
            </figure>
            <div class="moves-wrap">
              <h3 data-i18n="web.auto.moves_title"></h3>
              <div class="moves-scroll" tabindex="0" data-i18n-aria-label="web.auto.moves_title">
                <table class="moves">
                  <thead>
                    <tr>
                      <th scope="col" data-i18n="web.auto.col_n"></th>
                      <th scope="col" data-i18n="web.auto.col_piece"></th>
                      <th scope="col" data-i18n="web.auto.col_move"></th>
                    </tr>
                  </thead>
                  <tbody id="moves-body"></tbody>
                </table>
                <p id="moves-empty" class="muted small" data-i18n="web.auto.no_moves"></p>
              </div>
            </div>
          </div>
        </div>

        <!-- Manuel mod: eklem ve kartezyen sürme, FK/IK önizleme -->
        <div id="panel-manual" role="tabpanel" aria-labelledby="tab-manual" class="tabpanel" hidden>
          <fieldset class="group" id="joints">
            <legend data-i18n="web.manual.joints_title"></legend>
            <p class="muted small" data-i18n="web.manual.joints_hint"></p>
            <p id="joints-hint-range" class="muted small"></p>
            <div id="joint-rows"></div>
            <div id="fk-preview" class="preview" role="status" aria-live="polite"></div>
            <div class="row">
              <button type="button" id="joints-go" class="primary" data-i18n="web.jog.go"></button>
              <button
                type="button"
                id="joints-sync"
                class="ghost"
                data-i18n="web.manual.sync"
              ></button>
            </div>
          </fieldset>

          <fieldset class="group" id="cart">
            <legend data-i18n="web.manual.cart_title"></legend>
            <p id="cart-range" class="muted small"></p>
            <div id="cart-rows"></div>
            <div id="ik-preview" class="preview" role="status" aria-live="polite"></div>
            <div class="row">
              <button type="button" id="cart-go" class="primary" data-i18n="web.jog.go"></button>
              <button type="button" id="cart-home" data-i18n="web.jog.home"></button>
              <button
                type="button"
                id="cart-sync"
                class="ghost"
                data-i18n="web.manual.sync"
              ></button>
            </div>
          </fieldset>

          <div class="row">
            <button type="button" id="magnet-toggle" data-i18n="web.jog.magnet_on"></button>
            <button type="button" id="torque-on" data-i18n="web.manual.ready"></button>
          </div>
          <button
            type="button"
            class="stop stop-big"
            data-action="stop"
            data-i18n="web.jog.stop"
            data-i18n-aria-label="web.exp.stop_aria"
          ></button>
          <div id="manual-result" class="result" role="status" aria-live="polite"></div>
          <p id="tele-event" class="event muted small" data-i18n="web.telemetry.no_event"></p>
        </div>
      </section>
    </main>
  </body>
</html>
