# Python araç ayarları. Paket tanımı ileride (F1 Python bağlaması, F4 istemci) eklenir.

[tool.ruff]
line-length = 100
target-version = "py311" # FreeCAD 1.1 Python 3.11 ile çalışır

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle, I: import sırası, UP: modern sözdizimi, B: olası hatalar
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# v1_vectors.py ana makinede bir kez çalışan üretim betiğidir (V1 koduna erişir).
omit = ["tools/v1_vectors.py"]

[tool.ruff.lint.per-file-ignores]
# HTML şablonu ve tablo satırları doğal olarak uzun; anlamı bölmemek için satır sınırı uygulanmaz.
"tools/datasheet/build_datasheet.py" = ["E501"]
