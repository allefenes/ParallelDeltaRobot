# Delta Robotics V2 malzeme listesi (BOM): elle tutulan kaynak.
#
# Adet ve birim kütle, CAD'de modellenen parçalarda `cad` alanındaki etiket(ler)den otomatik gelir
# (cad/out/parts.json, ./tools/cad.sh build üretir). CAD'de olmayan kalemlerde `qty` ve
# `unit_mass_g` elle yazılır. hardware/bom.csv ve hardware/bom.md bu dosyadan üretilir:
#   docker compose run --rm dev python3 tools/bom.py          (üret)
#   docker compose run --rm dev python3 tools/bom.py --check  (CI: CAD ile senkron mu, dosyalar güncel mi)
#
# Alanlar:
#   id        kalem numarası (bir kez verilir, değişmez)
#   name      Türkçe ad
#   category  govde | baski | satin_alma | baglanti | elektronik | sarf
#   spec      malzeme / standart / model
#   method    üretim yöntemi
#   supplier  tedarikçi (bilinmiyorsa TBD)
#   price     yaklaşık birim fiyat, TL (bilinmiyorsa boş)
#   status    v1 (V1'deki gibi) | varsayim (bilgi yok, seçildi) | v2 (V2'de değişti)
#   notes     not

items:
  # --- Gövde (metal / plastik levha) ---
