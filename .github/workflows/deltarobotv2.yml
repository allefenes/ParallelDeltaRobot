# Delta Robotics V2 CI: yalnız DeltaRobotV2/ ya da bu dosya değişince çalışır.
name: DeltaRobotV2

on:
  push:
    paths:
      - "DeltaRobotV2/**"
      - ".github/workflows/deltarobotv2.yml"
  pull_request:
    paths:
      - "DeltaRobotV2/**"
      - ".github/workflows/deltarobotv2.yml"

jobs:
  checks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: DeltaRobotV2
    steps:
      - uses: actions/checkout@v4

      - name: Geliştirme imajını derle
        run: docker build -t deltarobotv2-dev:ci docker/dev

      - name: Denetimler (tools/ci.sh)
        run: >
          docker run --rm
          -u "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD":/workspace -w /workspace
          deltarobotv2-dev:ci ./tools/ci.sh

      - name: Kapsama raporları (artefakt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kapsama-raporlari
          path: DeltaRobotV2/build/coverage/
          if-no-files-found: ignore
